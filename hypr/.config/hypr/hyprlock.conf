source = ~/.config/hypr/colors.conf
$Scripts = $HOME/.config/hypr/scripts

# --- Color Mappings ---
# Links Material 3 names to your Wallust colors
$on_secondary_container = $color7
$secondary = $color4
$source_color = $color2
# ----------------------

background {
    monitor =
    path = ~/.config/hypr/current_wallpaper # CURRENT WALLPAPER
    
    color = $background # Uses background from colors.conf

    blur_size = 3
    blur_passes = 2 # 0 disables blurring
    noise = 0.0117
    contrast = 1.3000 # Vibrant!!!
    brightness = 0.6000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

# Hours
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H") </big></b>"
    color = $on_secondary_container
    font_size = 139
    font_family = Adwaita Sans
    shadow_passes = 0
    shadow_size = 0

    position = 0, 220
    halign = center
    valign = center
}

# Minutes
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%M") </big></b>"
    color = $on_secondary_container
    font_size = 136
    font_family = Adwaita Sans
    shadow_passes = 0
    shadow_size = 0

    position = 0, 70
    halign = center
    valign = center
}

# Today
label {
    monitor =
    text = cmd[update:18000000] echo "<b><big> "$(date +'%A')" </big></b>"
    color = $foreground
    font_size = 25
    font_family = JetBrainsMono NFM

    position = 0, -18
    halign = center
    valign = center
}

# Week
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%d %b')" </b>"
    color = $foreground
    font_size = 20
    font_family = JetBrainsMono Nerd Font 10

    position = 0, -45
    halign = center
    valign = center
}

