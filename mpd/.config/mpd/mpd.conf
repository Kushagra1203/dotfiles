music_directory    "/home/kushagra/music"
playlist_directory "/home/kushagra/.config/mpd/playlists"
db_file            "/home/kushagra/.config/mpd/database"
log_file           "/home/kushagra/.config/mpd/log"
pid_file           "/home/kushagra/.config/mpd/pid"
state_file         "/home/kushagra/.config/mpd/state"

# Keep the rest the same
bind_to_address    "127.0.0.1"
auto_update        "yes"

audio_output {
    type            "pipewire"
    name            "PipeWire Output"
}

audio_output {
   type   "fifo"
   name   "my_fifo"
   path   "/tmp/mpd.fifo"
   format "44100:16:2"
}
