[config]
version = 2
caching = true

[theme]
type = "material-you"

# ─────────────────────────────────────────────
# GTK3 + GTK4 
# ─────────────────────────────────────────────
[templates.gtk3]
input_path = "~/.config/matugen/templates/gtk/colors.template.css"
output_path = "~/.config/gtk-3.0/colors.css"

[templates.gtk4]
input_path = "~/.config/matugen/templates/gtk/colors.template.css"
output_path = "~/.config/gtk-4.0/colors.css"


# ─────────────────────────────────────────────
# Kitty terminal
# ─────────────────────────────────────────────
[templates.kitty]
input_path = "~/.config/matugen/templates/kitty/kitty.conf.template"
output_path = "~/.config/kitty/kitty-theme.conf"
post_hook = 'pkill -SIGUSR1 kitty'

# ─────────────────────────────────────────────
# Wofi launcher
# ─────────────────────────────────────────────
[templates.wofi]
input_path = "~/.config/matugen/templates/wofi/style.css.template"
output_path = "~/.config/wofi/style.css"


# ─────────────────────────────────────────────
# Hyprland colors include file
# ─────────────────────────────────────────────
[templates.hypr]
input_path = "~/.config/matugen/templates/hypr/colors.conf.template"
output_path = "~/.config/hypr/colors.conf"

[templates.cursor]
input_path = '~/.config/matugen/templates/hypr/render.json'
output_path = '~/Downloads/bibata_cursor/config/render.json'
post_hook = '''
cd ~/Downloads/bibata_cursor && \
rm -rf ./out && \
./src/cursor_utils.py --hypr --theme Bibata-Modern-Classic --out-dir ./out && \
cp -r ./out/Bibata-Modern-Classic ~/.local/share/icons/ && \
hyprctl setcursor Bibata-Modern-Classic 24
'''

# ─────────────────────────────────────────────
# Qt6 / KDE
# ─────────────────────────────────────────────
[templates.qt6ct]
input_path = '~/.config/matugen/templates/qt6/qt6.conf.template'
output_path = '~/.config/qt6ct/colors/matugen.conf'

# ─────────────────────────────────────────────
# Kew
# ─────────────────────────────────────────────
[templates.kew]
input_path = "~/.config/matugen/templates/kew/material.theme.template"
output_path = "~/.config/kew/themes/material.theme"

# ─────────────────────────────────────────────
# zathura
# ─────────────────────────────────────────────
[templates.zathura]
input_path = '~/.config/matugen/templates/zathurarc/matugen-zathurarc.template'
output_path = '~/.config/zathura/matugen-zathurarc'

# ─────────────────────────────────────────────
# Nvim
# ─────────────────────────────────────────────
#[templates.nvim]
#input_path = "~/.config/matugen/templates/nvim/matugen.lua.template"
#output_path = "~/.config/nvim/colors/matugen.lua"

[templates.lualine]
input_path = "~/.config/matugen/templates/nvim/lualine.lua.template"
output_path = "~/.config/nvim/lua/plugins/lualine.lua"
post_command = "pgrep nvim && pkill -USR1 nvim 2>/dev/null || true"

# ─────────────────────────────────────────────
# rofi
# ─────────────────────────────────────────────
[templates.rofi]
input_path = '~/.config/matugen/templates/rofi/colors.rasi.template'
output_path = '~/.config/rofi/colors.rasi'

# ─────────────────────────────────────────────
# nchat
# ─────────────────────────────────────────────
[templates.nchat_color]
input_path = "~/.config/matugen/templates/nchat/nchat-color.conf"
output_path = "~/.config/nchat/color.conf"

[templates.nchat_usercolor]
input_path = "~/.config/matugen/templates/nchat/nchat-usercolor.conf"
output_path = "~/.config/nchat/usercolor.conf"

# ─────────────────────────────────────────────
# rmpc
# ─────────────────────────────────────────────
[templates.rmpc]
input_path = '~/.config/matugen/templates/rmpc/minimal.ron.template'
output_path = '~/.config/rmpc/themes/minimal.ron'

# ─────────────────────────────────────────────
# tmux
# ─────────────────────────────────────────────
[templates.tmux]
input_path = '~/.config/matugen/templates/tmux/tmux.conf.template'
output_path = '~/.config/tmux/tmux.conf'
post_command = "tmux info &>/dev/null && tmux source-file ~/.config/tmux/tmux.conf || true"

# ─────────────────────────────────────────────
# btop
# ─────────────────────────────────────────────
[templates.btop]
input_path = '~/.config/matugen/templates/btop/matugen.theme.template'
output_path = '~/.config/btop/themes/matugen.theme'

# ─────────────────────────────────────────────
# end-4
# ─────────────────────────────────────────────
[templates.quickshell]
input_path = "~/.config/matugen/templates/end-4/quickshell.json.template"
output_path = "~/.local/state/quickshell/user/generated/colors.json"

[templates.m3colors]
input_path = "~/.config/matugen/templates/end-4/m3colors.qml.template"
output_path = "~/.local/state/quickshell/user/generated/m3colors.qml"
post_hook = "pkill quickshell; while pgrep -x quickshell > /dev/null; do sleep 1; done; quickshell -c ii > /dev/null 2>&1 &"

# ─────────────────────────────────────────────
# userscripts
# ─────────────────────────────────────────────
[templates.catppuccin_lib]
input_path = "~/.config/matugen/templates/userscripts/lib.less.template"
output_path = '/home/kushagra/userstyles/lib/lib.less'
post_command = 'bash ~/.config/matugen/scripts/compile-userstyles.sh &'

# ─────────────────────────────────────────────
# userscripts
# ─────────────────────────────────────────────
[templates.zen_userChrome]
input_path = '~/.config/matugen/templates/zen/userChrome.css.template'
