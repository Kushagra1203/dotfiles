output_path = '~/.local/share/uv/tools/bagels/lib/python3.13/site-packages/bagels/themes.py'

# ─────────────────────────────────────────────
# obsidian
# ─────────────────────────────────────────────
[templates.obsidian]
input_path = '~/.config/matugen/templates/obsidian/theme.css.template'
output_path = '~/Obsidian/My Vault/.obsidian/snippets/matugen.css'

[templates.obsidian_2]
input_path = '~/.config/matugen/templates/obsidian/theme.css.template'
output_path = '~/Obsidian/Dashbaord/.obsidian/snippets/matugen.css'

[templates.tracker]
