output_path = '/home/kushagra/.zen/uhujqlks.Default (release)/chrome/userContent.css'

# ─────────────────────────────────────────────
# anki
# ─────────────────────────────────────────────
[templates.anki]
input_path = '~/.config/matugen/templates/anki/colors.json.template'
output_path = '/home/kushagra/.var/app/net.ankiweb.Anki/data/Anki2/addons21/688199788/themes/colors.json'

# ─────────────────────────────────────────────
# bagels
# ─────────────────────────────────────────────
[templates.bagels]
